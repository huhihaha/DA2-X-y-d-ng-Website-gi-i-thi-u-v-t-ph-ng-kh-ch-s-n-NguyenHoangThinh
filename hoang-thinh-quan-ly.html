<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hoàng Thịnh – Quản lý lễ tân</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #10231f;
        --ink2: #1d3a33;
        --paper: #f6f7f4;
        --line: #d5ddd9;
        --muted: #3f504a;
        --brass: #c9a24b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Be Vietnam Pro", system-ui, sans-serif;
        background: var(--paper);
        color: var(--ink);
        font-size: 15px;
        line-height: 1.5;
      }
      button,
      input,
      select {
        font-family: inherit;
        font-size: 15px;
      }
      :focus-visible {
        outline: 3px solid var(--brass);
        outline-offset: 2px;
      }
      .app {
        display: grid;
        grid-template-columns: 230px 1fr;
        min-height: 100vh;
      }
      .side {
        background: var(--ink);
        color: #fff;
        padding: 24px 14px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .brand {
        font-weight: 800;
        letter-spacing: 0.1em;
        font-size: 18px;
        padding: 0 10px;
      }
      .brand small {
        display: block;
        font-weight: 400;
        letter-spacing: 0;
        font-size: 13px;
        color: #b9c8c2;
      }
      .side nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .side nav button {
        background: none;
        border: 0;
        color: #d9e2de;
        text-align: left;
        padding: 12px 12px;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 44px;
      }
      .side nav button:hover {
        background: var(--ink2);
      }
      .side nav button.on {
        background: var(--brass);
        color: var(--ink);
        font-weight: 700;
      }
      .side nav i {
        font-style: normal;
        background: #fff;
        color: var(--ink);
        border-radius: 10px;
        font-size: 12px;
        font-weight: 700;
        padding: 0 8px;
      }
      .reset {
        margin-top: auto;
        background: none;
        border: 1px solid #4b6a62;
        color: #b9c8c2;
        border-radius: 6px;
        padding: 10px;
        cursor: pointer;
      }
      .main {
        padding: 28px 32px;
        min-width: 0;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .top h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
      }
      .top span {
        color: var(--muted);
      }
      .bar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .bar input,
      .bar select {
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid #7f8f89;
        border-radius: 6px;
        background: #fff;
        min-width: 200px;
      }
      .sp {
        flex: 1;
      }
      .btn {
        background: var(--ink);
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 10px 18px;
        min-height: 44px;
        font-weight: 700;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--ink2);
      }
      .btn.gold {
        background: var(--brass);
        color: var(--ink);
      }
      .btn.ghost {
        background: #fff;
        color: var(--ink);
        border: 1px solid #7f8f89;
      }
      .sm {
        min-height: 36px;
        padding: 6px 12px;
        font-size: 14px;
      }
      .tw {
        overflow-x: auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
      }
      th {
        text-align: left;
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        background: #eef1ee;
      }
      td {
        padding: 12px 14px;
        border-bottom: 1px solid #e7ece9;
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      td.act {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }
      td.num,
      th.num {
        text-align: right;
      }
      .empty {
        padding: 40px;
        text-align: center;
        color: var(--muted);
      }
      .chip {
        display: inline-block;
        border-radius: 12px;
        padding: 2px 10px;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
      }
      .c-wait {
        background: #fbefd0;
        color: #6b4a00;
      }
      .c-ok {
        background: #ddf0e3;
        color: #14351f;
      }
      .c-stay {
        background: #dce8f5;
        color: #12315a;
      }
      .c-no {
        background: #f6dedb;
        color: #7a1812;
      }
      .c-muted {
        background: #e6eae8;
        color: #33423d;
      }
      .stats {
        display: flex;
        gap: 12px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .stats div {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 18px;
      }
      .stats b {
        font-size: 22px;
        margin-right: 6px;
      }
      .rooms {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 16px;
      }
      .rc {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        border-top: 4px solid var(--line);
      }
      .rc.s-stay {
        border-top-color: #2f5d9e;
      }
      .rc.s-free {
        border-top-color: #2e7d4f;
      }
      .rc.s-clean {
        border-top-color: #b7791f;
      }
      .rc h3 {
        margin: 0;
        font-size: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .rc p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .rc .btns {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      dialog {
        border: 0;
        border-radius: 10px;
        padding: 0;
        width: min(520px, 94vw);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      dialog::backdrop {
        background: rgba(10, 23, 20, 0.55);
      }
      #mForm {
        padding: 26px;
      }
      #mForm h2 {
        margin: 0 0 16px;
        font-size: 21px;
      }
      .g {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      #mForm label {
        display: block;
        font-size: 14px;
        font-weight: 500;
      }
      #mForm input,
      #mForm select {
        display: block;
        width: 100%;
        margin-top: 4px;
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid #7f8f89;
        border-radius: 6px;
        background: #fff;
      }
      .full {
        grid-column: 1/-1;
      }
      #mErr {
        color: #b3261e;
        font-size: 14px;
        min-height: 20px;
        margin-top: 10px;
      }
      .mb {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .inv table {
        min-width: 0;
        margin: 10px 0;
      }
      .inv .tot td {
        font-weight: 800;
        font-size: 17px;
      }
      #toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        padding: 12px 20px;
        border-radius: 8px;
        display: none;
        z-index: 99;
      }
      #who {
        padding: 0 10px;
        font-size: 14px;
        color: #d9e2de;
      }
      #who small {
        display: block;
        color: #9fb2ab;
        font-size: 13px;
      }
      .logout {
        background: none;
        border: 1px solid #4b6a62;
        color: #d9e2de;
        border-radius: 6px;
        padding: 10px;
        cursor: pointer;
      }
      .logout:hover,
      .reset:hover {
        background: var(--ink2);
      }
      @media (max-width: 820px) {
        .app {
          grid-template-columns: 1fr;
        }
        .side {
          position: static;
          height: auto;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
          padding: 12px;
        }
        .side nav {
          flex-direction: row;
          flex-wrap: wrap;
        }
        .reset {
          margin: 0 0 0 auto;
        }
        .main {
          padding: 20px 14px;
        }
        .g {
          grid-template-columns: 1fr;
        }
      }
      @media print {
        .app,
        #toast {
          display: none;
        }
        dialog {
          position: static;
          width: 100%;
          box-shadow: none;
        }
        .mb {
          display: none;
        }
      }
    </style>
    <script>
      /* Chưa đăng nhập -> quay về trang giới thiệu */
      (function () {
        var ok = false;
        try {
          ok = !!JSON.parse(sessionStorage.getItem("ht_staff"));
        } catch (e) {}
        if (!ok) {
          document.documentElement.style.display = "none";
          location.replace("hoang-thinh-hotel.html");
        }
      })();
    </script>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">HOÀNG THỊNH<small>Quản lý lễ tân</small></div>
        <nav id="nav" aria-label="Chức năng"></nav>
        <div id="who"></div>
        <button class="reset" id="reset">Đặt lại dữ liệu mẫu</button>
        <button class="logout" id="logout">Đăng xuất</button>
      </aside>
      <main class="main">
        <header class="top">
          <h1 id="title"></h1>
          <span id="today"></span>
        </header>
        <div id="view"></div>
      </main>
    </div>
    <dialog id="dlg">
      <form id="mForm">
        <h2 id="mTitle"></h2>
        <div id="mBody"></div>
        <div id="mErr" role="alert"></div>
        <div class="mb">
          <button type="button" class="btn ghost" id="mCancel">Đóng</button
          ><button class="btn gold" id="mOk"></button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status"></div>

    <script>
      /* ===== CẤU HÌNH: sửa loại phòng, giá (VNĐ/đêm), dịch vụ ===== */
      const TYPES = {
        "tieu-chuan": { n: "Phòng Tiêu chuẩn", p: 650000, max: 2 },
        deluxe: { n: "Phòng Deluxe", p: 950000, max: 3 },
        "gia-dinh": { n: "Phòng Gia đình", p: 1350000, max: 4 },
      };
      const SERVICES = [
        ["Nước uống", 20000],
        ["Giặt ủi", 50000],
        ["Bữa ăn", 120000],
        ["Đưa đón sân bay", 250000],
      ];
      const BST = ["Chờ xác nhận", "Đã xác nhận", "Đã nhận phòng", "Đã hủy"];
      const BCLS = {
        "Chờ xác nhận": "c-wait",
        "Đã xác nhận": "c-ok",
        "Đã nhận phòng": "c-stay",
        "Đã hủy": "c-no",
      };
      const KEY = "hoang-thinh-pms-v1";

      /* ===== Tiện ích ===== */
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const money = (n) => n.toLocaleString("vi-VN") + " đ";
      const fd = (s) => (s ? s.split("-").reverse().join("/") : "");
      const nz = (s) =>
        String(s)
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/đ/g, "d")
          .toLowerCase();
      const d0 = new Date();
      d0.setHours(0, 0, 0, 0);
      const iso = (d) =>
        new Date(d.getTime() - d.getTimezoneOffset() * 6e4)
          .toISOString()
          .slice(0, 10);
      const add = (n) => {
        const x = new Date(d0);
        x.setDate(x.getDate() + n);
        return iso(x);
      };
      const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
      const validPhone = (p) =>
        /^(0|\+84)\d{9,10}$/.test(p.replace(/[\s.-]/g, ""));
      let tt;
      const toast = (m) => {
        const t = $("toast");
        t.textContent = m;
        t.style.display = "block";
        clearTimeout(tt);
        tt = setTimeout(() => (t.style.display = "none"), 2800);
      };

      /* ===== Dữ liệu (lưu trong localStorage của trình duyệt) ===== */
      function seed() {
        return {
          seq: { KH: 4, DP: 3, LT: 2, HD: 1 },
          customers: [
            {
              id: "KH001",
              name: "Nguyễn Văn An",
              phone: "0912345678",
              email: "an.nguyen@example.com",
              idno: "",
            },
            {
              id: "KH002",
              name: "Trần Thị Bình",
              phone: "0987654321",
              email: "",
              idno: "",
            },
            {
              id: "KH003",
              name: "Lê Minh Châu",
              phone: "0933222111",
              email: "chau.le@example.com",
              idno: "",
            },
            {
              id: "KH004",
              name: "Phạm Quốc Dũng",
              phone: "0966777888",
              email: "",
              idno: "",
            },
          ],
          rooms: [
            { no: "101", type: "tieu-chuan", status: "Đang ở" },
            { no: "102", type: "tieu-chuan", status: "Trống" },
            { no: "103", type: "tieu-chuan", status: "Trống" },
            { no: "201", type: "deluxe", status: "Trống" },
            { no: "202", type: "deluxe", status: "Dọn dẹp" },
            { no: "301", type: "gia-dinh", status: "Trống" },
            { no: "302", type: "gia-dinh", status: "Trống" },
          ],
          bookings: [
            {
              id: "DP001",
              cid: "KH001",
              type: "tieu-chuan",
              in: add(-1),
              out: add(1),
              guests: 2,
              status: "Đã nhận phòng",
            },
            {
              id: "DP002",
              cid: "KH002",
              type: "deluxe",
              in: add(1),
              out: add(3),
              guests: 2,
              status: "Chờ xác nhận",
            },
            {
              id: "DP003",
              cid: "KH003",
              type: "tieu-chuan",
              in: add(0),
              out: add(2),
              guests: 1,
              status: "Đã xác nhận",
            },
          ],
          stays: [
            {
              id: "LT001",
              bid: "DP001",
              cid: "KH001",
              roomNo: "101",
              in: add(-1),
              out: add(1),
              services: [{ n: "Nước uống × 2", v: 40000 }],
              active: true,
            },
            {
              id: "LT002",
              bid: "",
              cid: "KH004",
              roomNo: "202",
              in: add(-3),
              out: add(0),
              services: [],
              active: false,
            },
          ],
          invoices: [
            {
              id: "HD001",
              sid: "LT002",
              cid: "KH004",
              room: "202",
              date: add(0),
              lines: [{ n: "Phòng Deluxe 202 × 3 đêm", v: 2850000 }],
              total: 2850000,
              paid: true,
              method: "Tiền mặt",
            },
          ],
        };
      }
      let S;
      try {
        S = JSON.parse(localStorage.getItem(KEY));
      } catch (e) {}
      S = S || seed();
      const save = () => {
        try {
          localStorage.setItem(KEY, JSON.stringify(S));
        } catch (e) {}
      };
      const nid = (p) => {
        S.seq[p] = (S.seq[p] || 0) + 1;
        return p + String(S.seq[p]).padStart(3, "0");
      };
      const cust = (id) =>
        S.customers.find((c) => c.id === id) || { name: "(đã xóa)", phone: "" };
      const room = (no) => S.rooms.find((r) => r.no === no);
      const pending = () =>
        S.bookings.filter((b) => b.status === "Chờ xác nhận").length;

      /* ===== Giao diện chung ===== */
      const VIEWS = {
        bookings: "Đặt phòng",
        stays: "Lưu trú",
        customers: "Khách hàng",
        invoices: "Hóa đơn",
      };
      let ui = { view: "bookings", q: "", f: "" };
      const bar = (extra, btn) =>
        `<div class="bar"><input id="q" type="search" placeholder="Tìm kiếm…" value="${esc(ui.q)}" aria-label="Tìm kiếm">${extra || ""}<span class="sp"></span>${btn || ""}</div>`;
      const table = (heads, rows, empty) =>
        rows.length
          ? `<div class="tw"><table><thead><tr>${heads.map((h) => `<th${h === "Tổng" ? ' class="num"' : ""}>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`
          : `<div class="tw"><div class="empty">${empty}</div></div>`;
      const hit = (...a) => !ui.q || nz(a.join(" ")).includes(nz(ui.q));
      const chip = (t, c) => `<span class="chip ${c}">${esc(t)}</span>`;
      const btn = (t, act, id, cls) =>
        `<button class="btn sm ${cls || ""}" data-act="${act}" data-id="${id}">${t}</button>`;

      function render() {
        const had = document.activeElement && document.activeElement.id === "q";
        $("nav").innerHTML = Object.entries(VIEWS)
          .map(
            ([k, v]) =>
              `<button data-nav="${k}" class="${k === ui.view ? "on" : ""}">${v}${k === "bookings" && pending() ? `<i>${pending()}</i>` : ""}</button>`,
          )
          .join("");
        $("title").textContent = VIEWS[ui.view];
        $("today").textContent = "Hôm nay, " + fd(iso(d0));
        $("view").innerHTML = {
          bookings: vBookings,
          stays: vStays,
          customers: vCustomers,
          invoices: vInvoices,
        }[ui.view]();
        save();
        if (had) {
          const q = $("q");
          q.focus();
          q.setSelectionRange(q.value.length, q.value.length);
        }
      }

      /* ===== Đặt phòng ===== */
      function vBookings() {
        const rows = S.bookings
          .filter(
            (b) =>
              (!ui.f || b.status === ui.f) &&
              hit(b.id, cust(b.cid).name, cust(b.cid).phone),
          )
          .reverse()
          .map((b) => {
            const a =
              b.status === "Chờ xác nhận"
                ? btn("Xác nhận", "confirm", b.id) +
                  btn("Hủy", "cancel", b.id, "ghost")
                : b.status === "Đã xác nhận"
                  ? btn("Nhận phòng", "checkin", b.id, "gold") +
                    btn("Hủy", "cancel", b.id, "ghost")
                  : "";
            return `<tr><td>${b.id}</td><td><b>${esc(cust(b.cid).name)}</b><br><small>${esc(cust(b.cid).phone)}</small></td><td>${TYPES[b.type].n}</td><td>${fd(b.in)}</td><td>${fd(b.out)}</td><td>${b.guests}</td><td>${chip(b.status, BCLS[b.status])}</td><td class="act">${a}</td></tr>`;
          });
        const sel = `<select id="f" aria-label="Lọc trạng thái"><option value="">Tất cả trạng thái</option>${BST.map((s) => `<option ${s === ui.f ? "selected" : ""}>${s}</option>`).join("")}</select>`;
        return (
          bar(
            sel,
            '<button class="btn gold" data-act="newBooking">+ Thêm đặt phòng</button>',
          ) +
          table(
            [
              "Mã",
              "Khách",
              "Loại phòng",
              "Nhận",
              "Trả",
              "Số khách",
              "Trạng thái",
              "",
            ],
            rows,
            "Không có đặt phòng phù hợp.",
          )
        );
      }
      const typeOpts = () =>
        Object.entries(TYPES)
          .map(([k, t]) => `<option value="${k}">${t.n}</option>`)
          .join("");
      const A = {
        newBooking() {
          modal(
            "Thêm đặt phòng",
            `<div class="g"><label>Họ và tên<input name="name" required></label><label>Số điện thoại<input name="phone" type="tel" required></label>
  <label>Loại phòng<select name="type">${typeOpts()}</select></label><label>Số khách<select name="guests">${[1, 2, 3, 4].map((n) => `<option ${n == 2 ? "selected" : ""}>${n}</option>`).join("")}</select></label>
  <label>Nhận phòng<input name="in" type="date" value="${add(0)}" required></label><label>Trả phòng<input name="out" type="date" value="${add(1)}" required></label></div>`,
            "Lưu đặt phòng",
            (f) => {
              const name = f.get("name").trim(),
                phone = f.get("phone").replace(/[\s.-]/g, ""),
                type = f.get("type"),
                g = +f.get("guests");
              if (name.length < 2) return "Nhập họ và tên khách.";
              if (!validPhone(phone))
                return "Số điện thoại chưa hợp lệ, ví dụ 0912345678.";
              if (f.get("in") < iso(d0))
                return "Ngày nhận phòng không được ở quá khứ.";
              if (days(f.get("in"), f.get("out")) < 1)
                return "Ngày trả phòng phải sau ngày nhận phòng.";
              if (g > TYPES[type].max)
                return `${TYPES[type].n} chỉ nhận tối đa ${TYPES[type].max} khách.`;
              let c = S.customers.find((c) => c.phone === phone);
              if (!c) {
                c = { id: nid("KH"), name, phone, email: "", idno: "" };
                S.customers.push(c);
              }
              S.bookings.push({
                id: nid("DP"),
                cid: c.id,
                type,
                in: f.get("in"),
                out: f.get("out"),
                guests: g,
                status: "Đã xác nhận",
              });
              toast("Đã thêm đặt phòng (trạng thái: Đã xác nhận).");
            },
          );
        },
        confirm(id) {
          S.bookings.find((b) => b.id === id).status = "Đã xác nhận";
          render();
        },
        cancel(id) {
          modal(
            "Hủy đặt phòng " + id,
            "<p>Bạn chắc chắn muốn hủy đặt phòng này?</p>",
            "Hủy đặt phòng",
            () => {
              S.bookings.find((b) => b.id === id).status = "Đã hủy";
            },
          );
        },
        checkin(id) {
          const b = S.bookings.find((x) => x.id === id),
            free = S.rooms.filter(
              (r) => r.type === b.type && r.status === "Trống",
            );
          if (!free.length)
            return toast(
              "Hiện không còn phòng trống loại " + TYPES[b.type].n + ".",
            );
          modal(
            "Nhận phòng " + id,
            `<p>${esc(cust(b.cid).name)} · ${TYPES[b.type].n}</p><label>Chọn phòng<select name="room">${free.map((r) => `<option>${r.no}</option>`).join("")}</select></label>`,
            "Xác nhận nhận phòng",
            (f) => {
              const no = f.get("room");
              room(no).status = "Đang ở";
              b.status = "Đã nhận phòng";
              S.stays.push({
                id: nid("LT"),
                bid: b.id,
                cid: b.cid,
                roomNo: no,
                in: iso(d0),
                out: b.out,
                services: [],
                active: true,
              });
              ui.view = "stays";
              toast("Đã nhận phòng " + no + ".");
            },
          );
        },

        /* ===== Lưu trú ===== */
        service(id) {
          modal(
            "Thêm dịch vụ",
            `<div class="g"><label class="full">Dịch vụ<select name="svc">${SERVICES.map((s, i) => `<option value="${i}">${s[0]} – ${money(s[1])}</option>`).join("")}</select></label><label>Số lượng<input name="qty" type="number" min="1" value="1"></label></div>`,
            "Thêm dịch vụ",
            (f) => {
              const s = SERVICES[+f.get("svc")],
                q = Math.max(1, +f.get("qty") || 1);
              S.stays
                .find((x) => x.id === id)
                .services.push({ n: `${s[0]} × ${q}`, v: s[1] * q });
            },
          );
        },
        checkout(id) {
          const s = S.stays.find((x) => x.id === id),
            inv = bill(s);
          modal(
            "Trả phòng " + s.roomNo,
            `<p>${esc(cust(s.cid).name)}</p>${invTable(inv.lines, inv.total)}`,
            "Trả phòng & tạo hóa đơn",
            () => {
              s.active = false;
              room(s.roomNo).status = "Dọn dẹp";
              const b = S.bookings.find((b) => b.id === s.bid);
              if (b) b.status = "Đã nhận phòng";
              S.invoices.push({
                id: nid("HD"),
                sid: s.id,
                cid: s.cid,
                room: s.roomNo,
                date: iso(d0),
                ...inv,
                paid: false,
                method: "",
              });
              ui.view = "invoices";
              toast("Đã tạo hóa đơn.");
            },
          );
        },
        clean(no) {
          room(no).status = "Trống";
          render();
        },

        /* ===== Khách hàng ===== */
        newCustomer() {
          custForm();
        },
        editCustomer(id) {
          custForm(S.customers.find((c) => c.id === id));
        },

        /* ===== Hóa đơn ===== */
        viewInv(id) {
          const i = S.invoices.find((x) => x.id === id);
          modal(
            "Hóa đơn " + i.id,
            `<div class="inv"><p><b>Khách sạn Hoàng Thịnh</b><br>Khách: ${esc(cust(i.cid).name)} · Phòng ${i.room}<br>Ngày: ${fd(i.date)} · ${i.paid ? "Đã thanh toán (" + i.method + ")" : "Chưa thanh toán"}</p>${invTable(i.lines, i.total)}</div>`,
            "In hóa đơn",
            () => {
              window.print();
              return false;
            },
          );
        },
        pay(id) {
          const i = S.invoices.find((x) => x.id === id);
          modal(
            "Thu tiền " + i.id,
            `<p>Số tiền: <b>${money(i.total)}</b></p><label>Hình thức<select name="m"><option>Tiền mặt</option><option>Chuyển khoản</option><option>Thẻ</option></select></label>`,
            "Xác nhận đã thu",
            (f) => {
              i.paid = true;
              i.method = f.get("m");
              toast("Đã ghi nhận thanh toán.");
            },
          );
        },
      };

      function bill(s) {
        const n = Math.max(1, days(s.in, iso(d0))),
          t = TYPES[room(s.roomNo).type];
        const lines = [
          { n: `${t.n} ${s.roomNo} × ${n} đêm`, v: t.p * n },
          ...s.services,
        ];
        return { lines, total: lines.reduce((a, l) => a + l.v, 0) };
      }
      const invTable = (lines, total) =>
        `<table>${lines.map((l) => `<tr><td>${esc(l.n)}</td><td class="num">${money(l.v)}</td></tr>`).join("")}<tr class="tot"><td>Tổng cộng</td><td class="num">${money(total)}</td></tr></table>`;

      function vStays() {
        const c = (s) => S.rooms.filter((r) => r.status === s).length;
        const cards = S.rooms
          .filter((r) => hit(r.no, TYPES[r.type].n))
          .map((r) => {
            const s = S.stays.find((s) => s.active && s.roomNo === r.no),
              cls =
                r.status === "Đang ở"
                  ? "s-stay"
                  : r.status === "Trống"
                    ? "s-free"
                    : "s-clean";
            const ch = chip(
              r.status,
              r.status === "Đang ở"
                ? "c-stay"
                : r.status === "Trống"
                  ? "c-ok"
                  : "c-wait",
            );
            let body = "<p>Sẵn sàng đón khách.</p>";
            if (s)
              body = `<p><b>${esc(cust(s.cid).name)}</b></p><p>Nhận ${fd(s.in)} · dự kiến trả ${fd(s.out)}</p><p>Dịch vụ: ${s.services.length ? money(s.services.reduce((a, x) => a + x.v, 0)) : "chưa có"}</p><div class="btns">${btn("+ Dịch vụ", "service", s.id, "ghost")}${btn("Trả phòng", "checkout", s.id)}</div>`;
            if (r.status === "Dọn dẹp")
              body = `<p>Đang chờ dọn phòng.</p><div class="btns">${btn("Dọn xong", "clean", r.no, "gold")}</div>`;
            return `<div class="rc ${cls}"><h3>Phòng ${r.no}${ch}</h3><p>${TYPES[r.type].n}</p>${body}</div>`;
          })
          .join("");
        return (
          bar() +
          `<div class="stats"><div><b>${c("Trống")}</b>trống</div><div><b>${c("Đang ở")}</b>đang ở</div><div><b>${c("Dọn dẹp")}</b>chờ dọn</div></div><div class="rooms">${cards || '<div class="empty">Không có phòng phù hợp.</div>'}</div>`
        );
      }

      function vCustomers() {
        const rows = S.customers
          .filter((c) => hit(c.id, c.name, c.phone, c.email, c.idno))
          .map(
            (c) =>
              `<tr><td>${c.id}</td><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.email) || "–"}</td><td>${esc(c.idno) || "–"}</td><td>${S.stays.filter((s) => s.cid === c.id).length}</td><td class="act">${btn("Sửa", "editCustomer", c.id, "ghost")}</td></tr>`,
          );
        return (
          bar(
            "",
            '<button class="btn gold" data-act="newCustomer">+ Thêm khách hàng</button>',
          ) +
          table(
            [
              "Mã",
              "Họ và tên",
              "Điện thoại",
              "Email",
              "CCCD/Hộ chiếu",
              "Lượt lưu trú",
              "",
            ],
            rows,
            "Không tìm thấy khách hàng.",
          )
        );
      }
      function custForm(c) {
        modal(
          c ? "Sửa khách hàng" : "Thêm khách hàng",
          `<div class="g"><label>Họ và tên<input name="name" required value="${esc(c?.name)}"></label><label>Số điện thoại<input name="phone" type="tel" required value="${esc(c?.phone)}"></label>
  <label>Email<input name="email" type="email" value="${esc(c?.email)}"></label><label>CCCD/Hộ chiếu<input name="idno" value="${esc(c?.idno)}"></label></div>`,
          "Lưu",
          (f) => {
            const name = f.get("name").trim(),
              phone = f.get("phone").replace(/[\s.-]/g, "");
            if (name.length < 2) return "Nhập họ và tên.";
            if (!validPhone(phone)) return "Số điện thoại chưa hợp lệ.";
            if (S.customers.some((x) => x.phone === phone && x !== c))
              return "Số điện thoại này đã thuộc về khách hàng khác.";
            const d = {
              name,
              phone,
              email: f.get("email").trim(),
              idno: f.get("idno").trim(),
            };
            if (c) Object.assign(c, d);
            else S.customers.push({ id: nid("KH"), ...d });
          },
        );
      }

      function vInvoices() {
        const rows = S.invoices
          .filter(
            (i) =>
              (!ui.f || (ui.f === "paid") === i.paid) &&
              hit(i.id, cust(i.cid).name, i.room),
          )
          .reverse()
          .map(
            (i) =>
              `<tr><td>${i.id}</td><td>${esc(cust(i.cid).name)}</td><td>${i.room}</td><td>${fd(i.date)}</td><td class="num">${money(i.total)}</td><td>${i.paid ? chip("Đã thanh toán", "c-ok") : chip("Chưa thanh toán", "c-wait")}</td><td class="act">${btn("Xem", "viewInv", i.id, "ghost")}${i.paid ? "" : btn("Thu tiền", "pay", i.id, "gold")}</td></tr>`,
          );
        const sel = `<select id="f" aria-label="Lọc"><option value="">Tất cả hóa đơn</option><option value="paid" ${ui.f === "paid" ? "selected" : ""}>Đã thanh toán</option><option value="unpaid" ${ui.f === "unpaid" ? "selected" : ""}>Chưa thanh toán</option></select>`;
        const owed = S.invoices
          .filter((i) => !i.paid)
          .reduce((a, i) => a + i.total, 0);
        return (
          bar(sel) +
          `<div class="stats"><div><b>${S.invoices.filter((i) => !i.paid).length}</b>chưa thanh toán</div><div><b>${money(owed)}</b>cần thu</div></div>` +
          table(
            ["Mã", "Khách", "Phòng", "Ngày", "Tổng", "Trạng thái", ""],
            rows,
            "Chưa có hóa đơn nào.",
          )
        );
      }

      /* ===== Hộp thoại dùng chung ===== */
      let onOk = null;
      function modal(title, html, ok, cb) {
        $("mTitle").textContent = title;
        $("mBody").innerHTML = html;
        $("mErr").textContent = "";
        $("mOk").textContent = ok;
        onOk = cb;
        $("dlg").showModal();
        const f = $("mBody").querySelector("input,select");
        if (f) f.focus();
      }
      $("mForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const r = onOk && onOk(new FormData($("mForm")));
        if (r === false) return;
        if (r) {
          $("mErr").textContent = r;
          return;
        }
        $("dlg").close();
        render();
      });
      $("mCancel").addEventListener("click", () => $("dlg").close());

      /* ===== Sự kiện ===== */
      document.addEventListener("click", (e) => {
        const n = e.target.closest("[data-nav]");
        if (n) {
          ui = { view: n.dataset.nav, q: "", f: "" };
          return render();
        }
        const a = e.target.closest("[data-act]");
        if (a && A[a.dataset.act]) {
          A[a.dataset.act](a.dataset.id);
          if (!$("dlg").open) render();
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "q") {
          ui.q = e.target.value;
          render();
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "f") {
          ui.f = e.target.value;
          render();
        }
      });
      $("reset").addEventListener("click", () => {
        if (confirm("Xóa mọi thay đổi và quay về dữ liệu mẫu?")) {
          S = seed();
          ui = { view: "bookings", q: "", f: "" };
          render();
        }
      });
      const staff = (() => {
        try {
          return JSON.parse(sessionStorage.getItem("ht_staff")) || {};
        } catch (e) {
          return {};
        }
      })();
      $("who").innerHTML =
        esc(staff.name || "") + "<small>" + esc(staff.role || "") + "</small>";
      $("logout").addEventListener("click", () => {
        try {
          sessionStorage.removeItem("ht_staff");
        } catch (e) {}
        location.href = "hoang-thinh-hotel.html";
      });
      render();
    </script>
  </body>
</html>
